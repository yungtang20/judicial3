services:
  - type: web
    name: legal-case-workbench
    runtime: docker
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: legal-case-web/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_PROVIDER
        value: supabase
      - key: CASE_STORAGE_PROVIDER
        value: supabase
      - key: ALLOW_EXTERNAL_AI
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_OWNER_USER_ID
        sync: false
      - key: JUDICIAL_ENCRYPTION_KEY
        sync: false
