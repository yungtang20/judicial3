name: judicial3-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript lint
        run: npm run lint
      - name: Application tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Phase 3.2 audit
        shell: bash
        run: |
          set +e
          python tools/judicial3_phase3_2_audit.py --ci
          code=$?
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo 'CI local checks completed with an explicitly reported BLOCKED/NOT_RUN external check; this is not a live Render PASS.'
          fi
          exit 0
