name: judicial3-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript lint
        run: npm run lint
      - name: Application and browser tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret leakage scan
        run: python tools/secret_scan.py
      - name: Disaster recovery unit tests
        run: python -m unittest discover -s tools/tests
      - name: Embedded PostgreSQL acceptance
        run: npm run test:postgres-embedded
      - name: Phase 3.3 repository audit
        shell: bash
        run: |
          set +e
          python tools/judicial3_phase3_3_audit.py --ci
          code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then
            echo 'External Render checks are explicitly BLOCKED/NOT_RUN; repository quality gate remains independent.'
          fi
          exit 0
